name: ci

# 四段互相独立的验证：
#   managed       —— 托管库 + 打包器 + 132 条 xunit v3 测试（注意：不是 dotnet test）
#   native        —— C++ 原生核心/安装器（Release + /WX）+ 72 条原生测试
#   e2e           —— 容器校验、计划、失败上报的负例套件（不需要管理员，也不需要真实安装）
#   setup-package —— 分发安装包：构建内嵌载荷的 setup.exe，并真的装一次 / 卸一次
#
# NuGet 包 Msixpkg.Build 的「构建 + 发布」在 .github/workflows/nuget-publish.yml；
# 它的验收（包布局 / PackageReference 消费 / 两个 MSBuild 宿主 / 与黄金样本逐字节比对）是
# 本机脚本 tests\e2e\nuget-package-e2e.ps1，刻意不占 CI。
#
# 真实安装/卸载的闭环不在这里跑：它需要管理员、需要 AppXSvc，而且会真的改动运行器
# 的证书存储与包仓库。那部分由 tests/e2e/msixpkg-e2e.ps1 在专用机器或
# Windows Sandbox 里执行（见 tests/e2e/README.md）。

on:
  push:
    branches: [main, master, prod, 'feature/**']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  managed:
    name: managed (net10.0 + packer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 托管目标框架：Msixpkg.Core 多目标 netstandard2.0;net10.0，Msixpkg.Build（NuGet 任务包）
          # 必须能进 MSBuild 的 .NET Framework 宿主，测试与 CLI 用 net10.0（LTS）。
          dotnet-version: '10.0.x'

      - name: build
        run: dotnet build MsixpkgInstaller.slnx -c Release --nologo

      - name: build tests
        run: dotnet build tests\Msixpkg.Core.Tests -c Release --nologo

      - name: run managed tests
        # xunit v3 产出的是普通可执行程序：本机的 VSTest testhost 需要打开父进程句柄，
        # 在受限环境里会被拒绝（Win32Exception(5)），所以全仓库统一不用 dotnet test。
        run: tests\Msixpkg.Core.Tests\bin\Release\net10.0\Msixpkg.Core.Tests.exe

  native:
    name: native (MSVC + C++/WinRT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Wren 是 submodule（gui/ui）：GUI 目标默认链接它，不拉就会缺文件。
          submodules: recursive

      - name: pick the Visual Studio generator
        # 运行器镜像会换：windows-latest 自 2026-06 起是 Windows Server 2025 + VS 2026
        # （actions/runner-images#14017），写死 -G "Visual Studio 17 2022" 会直接
        # “could not find any instance of Visual Studio” 失败。
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\detect-vs-generator.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio generator detection failed' }

      - name: configure
        # CI 不复用本地 preset（那里写死了 "Visual Studio 18 2026"）。
        # 找不到 Windows SDK 的 cppwinrt 投影头时可以用 -DMSIXPKG_CPPWINRT_INCLUDE=<dir> 覆盖。
        run: >
          cmake -S src/MsixpkgInstaller.Native -B build/ci-native
          -G "${{ env.MSIXPKG_CMAKE_GENERATOR }}" -A x64
          -DMSIXPKG_WARNINGS_AS_ERRORS=ON

      - name: build (Release, warnings as errors)
        run: cmake --build build/ci-native --config Release --parallel

      - name: run native tests
        run: build\ci-native\Release\msixpkg_native_tests.exe

      - name: GUI smoke (Wren pages / MSAA report)
        # 只喂合成数据（--ui-page / --ui-result / --ui-progress），不安装任何东西。
        # 报告断言覆盖五页、同意页安全门、结果页按钮状态、主题/材质与帧统计。
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tests\e2e\gui-smoke.ps1
          -GuiPath build\ci-native\Release\msixpkg-installer.exe

      - name: setup GUI smoke (Wren setup/uninstaller pages)
        # setup 与 Uninstall.exe 的页面/控件 ID/主题也是发布物的一部分。
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tests\e2e\setup-gui-smoke.ps1
          -SetupPath build\ci-native\Release\msixpkg-setup.exe
          -UninstallPath build\ci-native\Release\msixpkg-uninstall.exe

      - name: cross-language check (native validator on the C#-produced golden container)
        # 这条断言的是「两端对同一份黄金样本的看法一致」：容器校验、钉扎、内容摘要。
        run: >
          build\ci-native\Release\msixpkg-native.exe install
          tests\vectors\Msixpkg.Sample_1.0.0.0_x64.msixpkg
          --pin 9cd702035dd941aa6fe12870550ffc61633281da08839cfb0dfb3a95e1b913b9
          --require-pin --dry-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-binaries
          path: |
            build/ci-native/Release/msixpkg-native.exe
            build/ci-native/Release/msixpkg_native_tests.exe
          if-no-files-found: warn

  e2e-negative:
    name: e2e negative suite
    runs-on: windows-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: pick the Visual Studio generator
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\detect-vs-generator.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio generator detection failed' }

      - name: configure
        run: >
          cmake -S src/MsixpkgInstaller.Native -B build/ci-native
          -G "${{ env.MSIXPKG_CMAKE_GENERATOR }}" -A x64
          -DMSIXPKG_WARNINGS_AS_ERRORS=ON

      - name: build
        run: cmake --build build/ci-native --config Debug --parallel

      - name: negative E2E
        # 不需要管理员、不需要真实安装，因此在托管运行器上可以跑。
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tests\e2e\msixpkg-negative.ps1
          -ExePath build\ci-native\Debug\msixpkg-native.exe

  setup-package:
    name: setup distribution package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: pick the Visual Studio generator
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\detect-vs-generator.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio generator detection failed' }

      - name: configure
        run: >
          cmake -S src/MsixpkgInstaller.Native -B build/ci-native
          -G "${{ env.MSIXPKG_CMAKE_GENERATOR }}" -A x64
          -DMSIXPKG_WARNINGS_AS_ERRORS=ON

      - name: build payload (Release)
        run: cmake --build build/ci-native --config Release --parallel

      - name: pack the setup exe
        # 自研 setup：CMake 产物 + 自附加载荷（不下载 NSIS，也不需要外部工具链）。
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts\build-setup.ps1
          -PayloadDir build\ci-native\Release
          -OutputDir artifacts\setup

      - name: install / uninstall E2E
        # 这一段是「真实机器」的验证：托管运行器允许子进程写 HKCU，所以安装记录、
        # ARP 条目、.msixpkg 关联与 PATH 的写入/清理断言都会真的执行
        #（本机受限环境里这一段会打印 SKIP，见 installer/setup/README.md）。
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tests\e2e\setup-installer-e2e.ps1
          -PayloadDir build\ci-native\Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup
          path: |
            artifacts/setup/*.exe
            artifacts/setup/*.zip
            artifacts/setup/*.sha256
          if-no-files-found: warn
